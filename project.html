<style>
   


h1 {
    color: #333;
    font-family: Arial, sans-serif;

}
p {

form {
    background: transparent;

    border: 1px solid #9500ff;
    border-radius: 5px;
    padding: 20px;
    width: 800px;
    margin: 0 auto;text-align: center;font-size: medium;
}
label{ text-align: left; font-size: medium; color: #0d0d0d; float: left;  font-family: sans-serif; background-color: #a908ff;
  border: #9500ff;  padding: 5px;width: 2%; ;
    margin: 5px 0 15px 0;
font-weight: 500;}


input:focus ~ label, input:valid ~ label {
 transform: translateY(-50%) scale(0.8);
 background-color: #212121;
 padding: 0 .2em;
 color: #2196f3;}

 input:focus, input:valid {
 outline: none;
 border: 1.5px solid #1a73e8;}

input {
    width:50%;
    padding: 10px;
   margin: 5px 0 15px 0;
    color: rgb(4, 4, 4);
  border: 2px solid #8707ff;
  border-radius: 10px;
  padding: 10px ;
  margin: 5px 0 15px 0;
  background: transparent;
    background-color: rgb(255, 250, 250);
   transition: border 150ms cubic-bezier(0.4,0,0.2,1);
    font-size: medium;
    text-align: center;
}
input:active{
     box-shadow: 2px 2px 15px #8707ff inset;
}
input-group {
 position: relative;
}

button {
   padding: 1.3em 3em;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  font-weight: 500;
  color: #000;
  background-color: #fff;
  border: none;
  border-radius: 45px;
  box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease 0s;
  cursor: pointer;
  outline: none;

}

#checkbox {
    float: left;
}
#l:hover {
    background-color: #23c483;
  box-shadow: 0px 15px 20px rgba(46, 229, 157, 0.4);
  color: #fff;
  transform: translateY(-7px);
}

#l {
    
    transform: translateY(-1px);
}

#link {
   color: #fff;
  line-height: 2;
  position: relative;
  padding-right: 4px;
  text-decoration-line: none;

}
#link:hover {
    text-decoration-line: none;

}
#link:hover::before{

content: '';
  width: 6px;
  height: 6px;
  border-top: solid 2px #fff;
  border-right: solid 2px #fff;
  border-radius: 2px;
  position: absolute;
  top: 50%;
  left: 100%;
  transform: translateY(-50%) rotate(45deg);
  transition: transform .4s;

}


#guest {
    font-size: medium;
    color: #0d0d0d;
    text-decoration: line-through;
}
#lk{
    font-size: medium;
    color: #0d0d0d;
    text-decoration: none;
    font-family: sans-serif;
}
